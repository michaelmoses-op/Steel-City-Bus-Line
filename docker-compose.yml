services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: steel_city
      POSTGRES_PASSWORD: steel_city
      POSTGRES_DB: steel_city
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steel_city -d steel_city"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
