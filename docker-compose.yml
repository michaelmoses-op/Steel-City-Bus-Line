services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: steel_city
      POSTGRES_PASSWORD: steel_city
      POSTGRES_DB: steel_city
    ports:
      # Host 5433 avoids conflict with a local Windows PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steel_city -d steel_city"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trip planner — enable with: pnpm otp:build && pnpm otp:up
  otp:
    profiles: ["otp"]
    image: opentripplanner/opentripplanner:2.7.0
    ports:
      - "8080:8080"
    volumes:
      - ./infra/otp:/var/opentripplanner
    environment:
      # Graph build needs more heap; clipped Pittsburgh OSM fits ~4g (raise if you OOM again).
      JAVA_TOOL_OPTIONS: "-Xmx4g"
    command:
      - --load
      - --serve
      - --port
      - "8080"
volumes:
  pgdata:
